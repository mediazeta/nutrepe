<header [class]="'sticky top-0 z-50 w-full transition-all duration-300 ' + headerClasses">
  <app-container className="flex h-18 items-center justify-between py-4">
    <a href="#top" class="text-forest">
      <app-logo [markSize]="38"></app-logo>
    </a>

    <nav class="hidden items-center gap-8 lg:flex">
      @for (link of navLinks; track link.href) {
        <a [href]="link.href" class="text-sm font-medium text-ink/80 transition-colors hover:text-forest">
          {{ link.label }}
        </a>
      }
    </nav>

    <div class="hidden items-center gap-3 lg:flex">
      <app-button href="#planes" variant="ghost" size="md">Ver planes</app-button>
      <app-button href="#cta-final" variant="primary" size="md">Empezar</app-button>
    </div>

    <button
      aria-label="Abrir menú"
      class="flex h-10 w-10 items-center justify-center rounded-full text-forest lg:hidden"
      (click)="toggle()"
    >
      @if (open()) {
        <lucide-angular name="x" class="h-6 w-6"></lucide-angular>
      } @else {
        <lucide-angular name="menu" class="h-6 w-6"></lucide-angular>
      }
    </button>
  </app-container>

  @if (open()) {
    <div class="border-t border-forest/10 bg-cream px-5 pb-6 pt-2 lg:hidden">
      <nav class="flex flex-col gap-1">
        @for (link of navLinks; track link.href) {
          <a
            [href]="link.href"
            (click)="close()"
            class="rounded-lg px-3 py-3 text-sm font-medium text-ink/85 hover:bg-forest-soft hover:text-forest"
          >
            {{ link.label }}
          </a>
        }
      </nav>
      <div class="mt-3 flex flex-col gap-2">
        <app-button href="#planes" variant="secondary" (clicked)="close()">Ver planes</app-button>
        <app-button href="#cta-final" variant="primary" (clicked)="close()">Empezar con Nutrepe</app-button>
      </div>
    </div>
  }
</header>
