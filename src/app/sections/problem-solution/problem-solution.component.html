<section class="py-20 sm:py-28">
  <app-container>
    <app-section-heading
      eyebrow="El problema"
      title="Comer mejor no debería ser complicado."
      description="Muchas personas no abandonan una alimentación saludable por falta de voluntad, sino porque el proceso no está pensado para su vida real."
    ></app-section-heading>

    <div class="mt-14 grid gap-6 lg:grid-cols-2">
      <div class="rounded-3xl border border-ink/5 bg-white p-7 sm:p-9">
        <h3 class="text-sm font-semibold uppercase tracking-wide text-muted">Lo que suele pasar</h3>
        <ul class="mt-5 space-y-4">
          @for (p of problems; track p) {
            <li class="flex items-start gap-3">
              <lucide-angular name="circle-x" class="mt-0.5 h-5 w-5 shrink-0 text-ink/30"></lucide-angular>
              <span class="text-sm leading-relaxed text-ink/80 sm:text-base">{{ p }}</span>
            </li>
          }
        </ul>
      </div>

      <div class="rounded-3xl bg-forest p-7 text-cream sm:p-9">
        <h3 class="text-sm font-semibold uppercase tracking-wide text-mint">Lo que hace Nutrepe</h3>
        <ul class="mt-5 space-y-4">
          @for (s of solutions; track s) {
            <li class="flex items-start gap-3">
              <lucide-angular name="circle-check" class="mt-0.5 h-5 w-5 shrink-0 text-mint"></lucide-angular>
              <span class="text-sm leading-relaxed text-cream/90 sm:text-base">{{ s }}</span>
            </li>
          }
        </ul>
      </div>
    </div>
  </app-container>
</section>
