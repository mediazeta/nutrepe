<section id="la-app" class="py-20 sm:py-28">
  <app-container>
    <app-section-heading
      eyebrow="La aplicación"
      title="Conoce la aplicación Nutrepe"
      description="Cinco áreas pensadas para que seguir tu plan, resolver dudas y ver tu progreso sea sencillo, sin perder el acompañamiento profesional."
    ></app-section-heading>

    <div class="mt-14 grid gap-10 lg:grid-cols-[1fr_auto] lg:items-center">
      <div>
        <div class="flex flex-wrap gap-2">
          @for (tab of tabs; track tab.id) {
            <button
              (click)="select(tab.id)"
              [class]="
                'flex items-center gap-2 rounded-full px-4 py-2.5 text-sm font-semibold transition-colors ' +
                (tab.id === activeTab().id ? 'bg-forest text-cream' : 'border border-ink/10 bg-white text-ink/70 hover:border-ink/20')
              "
            >
              <lucide-angular [name]="tab.icon" class="h-4 w-4"></lucide-angular>
              {{ tab.tabLabel }}
            </button>
          }
        </div>

        <div class="mt-8 max-w-lg">
          <h3 class="text-3xl font-extrabold tracking-tight text-forest">{{ activeTab().title }}</h3>
          <p class="mt-3 text-base leading-relaxed text-muted">{{ activeTab().description }}</p>
          <ul class="mt-6 space-y-3">
            @for (point of activeTab().points; track point) {
              <li class="flex items-start gap-3">
                <span class="mt-0.5 font-bold text-mint">—</span>
                <span class="text-sm text-ink/80 sm:text-base">{{ point }}</span>
              </li>
            }
          </ul>
          <p class="mt-6 text-xs text-muted">Capturas reales de la aplicación Nutrepe.</p>
        </div>
      </div>

      <div class="mx-auto flex flex-col items-center">
        <div class="flex items-center gap-3 sm:gap-5">
          <button
            type="button"
            aria-label="Pantalla anterior"
            (click)="previous()"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-ink/10 bg-white text-forest transition-colors hover:border-ink/20 hover:text-mint"
          >
            <lucide-angular name="arrow-left" class="h-4 w-4"></lucide-angular>
          </button>

          <div class="relative">
            <app-phone-frame>
              <img [src]="'app/' + activeTab().screenshot" [alt]="activeTab().title" class="h-full w-full object-contain" />
            </app-phone-frame>
          </div>

          <button
            type="button"
            aria-label="Pantalla siguiente"
            (click)="next()"
            class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full border border-ink/10 bg-white text-forest transition-colors hover:border-ink/20 hover:text-mint"
          >
            <lucide-angular name="arrow-right" class="h-4 w-4"></lucide-angular>
          </button>
        </div>

        <div class="mt-6 flex items-center gap-2">
          @for (tab of tabs; track tab.id; let i = $index) {
            <button
              type="button"
              [attr.aria-label]="'Ver ' + tab.title"
              (click)="selectIndex(i)"
              [class]="
                'h-2 rounded-full transition-all ' +
                (tab.id === activeTab().id ? 'w-6 bg-mint' : 'w-2 bg-ink/15 hover:bg-ink/30')
              "
            ></button>
          }
        </div>
      </div>
    </div>
  </app-container>
</section>
