<section id="como-funciona" class="bg-cream-2 py-20 sm:py-28">
  <app-container>
    <app-section-heading
      eyebrow="Cómo funciona"
      title="De la primera pregunta a tu plan, en cuatro pasos."
      description="Un proceso sencillo que combina la valoración profesional con la comodidad de una herramienta digital."
    ></app-section-heading>

    <div class="mt-14 grid gap-6 sm:grid-cols-2 lg:grid-cols-4">
      @for (step of steps; track step.number) {
        <div class="relative rounded-3xl bg-white p-7 shadow-sm ring-1 ring-ink/5">
          <span class="text-4xl font-extrabold text-mint-soft">{{ step.number }}</span>
          <h3 class="mt-4 text-lg font-bold text-forest">{{ step.title }}</h3>
          <p class="mt-2 text-sm leading-relaxed text-muted">{{ step.description }}</p>
        </div>
      }
    </div>
  </app-container>
</section>
