<section id="faq" class="py-20 sm:py-28">
  <app-container>
    <app-section-heading eyebrow="Preguntas frecuentes" title="Lo que suele preguntarnos la gente"></app-section-heading>

    <div class="mt-12 max-w-3xl divide-y divide-ink/10 border-t border-ink/10">
      @for (faq of faqs; track faq.question; let i = $index) {
        <div>
          <button
            (click)="toggle(i)"
            class="flex w-full items-center justify-between gap-4 py-5 text-left"
            [attr.aria-expanded]="openIndex() === i"
          >
            <span class="font-semibold text-forest">{{ faq.question }}</span>
            <lucide-angular
              [name]="openIndex() === i ? 'minus' : 'plus'"
              class="h-4 w-4 shrink-0 text-mint"
            ></lucide-angular>
          </button>
          @if (openIndex() === i) {
            <div class="pb-5 text-sm leading-relaxed text-ink/70 sm:text-base">
              {{ faq.answer }}
              @if (faq.provisional) {
                <span class="mt-2 block text-xs font-medium text-warm">Contenido provisional, pendiente de confirmación final.</span>
              }
            </div>
          }
        </div>
      }
    </div>
  </app-container>
</section>
