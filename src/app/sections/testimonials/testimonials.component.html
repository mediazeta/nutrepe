<section class="py-20 sm:py-28">
  <app-container>
    <app-section-heading
      eyebrow="Confianza"
      title="La experiencia de Pablo, en la voz de quienes han trabajado con él"
      description="Opiniones reales sobre su trabajo como dietista-nutricionista, publicadas en su web profesional."
    ></app-section-heading>

    <div class="mt-12 grid gap-6 sm:mx-auto sm:max-w-3xl sm:grid-cols-2">
      @for (t of testimonials; track t.author) {
        <figure class="rounded-3xl bg-white p-7 ring-1 ring-ink/5">
          <lucide-angular name="quote" class="h-6 w-6 text-mint"></lucide-angular>
          <blockquote class="mt-4 text-sm leading-relaxed text-ink/85 sm:text-base">“{{ t.quote }}”</blockquote>
          <figcaption class="mt-4 text-sm">
            <span class="font-semibold text-forest">{{ t.author }}</span>
            <span class="text-muted"> · {{ t.role }}</span>
          </figcaption>
        </figure>
      }
    </div>

    <div class="mx-auto mt-10 flex max-w-2xl items-start gap-3 rounded-2xl border border-dashed border-forest/20 bg-mint-soft/60 p-5">
      <lucide-angular name="flask-conical" class="mt-0.5 h-5 w-5 shrink-0 text-forest-2"></lucide-angular>
      <p class="text-sm leading-relaxed text-forest-2/90">{{ pilotNote }}</p>
    </div>
  </app-container>
</section>
