<section class="py-20 sm:py-28">
  <app-container>
    <app-section-heading
      eyebrow="Confianza"
      title="La experiencia de Pablo, en la voz de quienes han trabajado con él"
      description="Opiniones reales sobre su trabajo como dietista-nutricionista."
    ></app-section-heading>

    <div class="mt-14 max-w-2xl border-t border-ink/10 pt-10">
      @for (t of testimonials; track t.author; let i = $index) {
        @if (i === activeIndex()) {
          <figure class="min-h-[150px] sm:min-h-[120px]">
            <span class="text-4xl font-extrabold text-mint">“</span>
            <blockquote class="-mt-2 text-lg leading-relaxed text-ink/85 sm:text-xl">{{ t.quote }}</blockquote>
            <figcaption class="mt-5 text-sm">
              <span class="font-semibold text-forest">{{ t.author }}</span>
              <span class="text-muted"> · {{ t.role }}</span>
            </figcaption>
          </figure>
        }
      }

      <div class="mt-8 flex items-center gap-2">
        @for (t of testimonials; track t.author; let i = $index) {
          <button
            type="button"
            [attr.aria-label]="'Ver opinión de ' + t.author"
            (click)="select(i)"
            [class]="
              'h-2 rounded-full transition-all ' +
              (i === activeIndex() ? 'w-6 bg-mint' : 'w-2 bg-ink/15 hover:bg-ink/30')
            "
          ></button>
        }
      </div>
    </div>
  </app-container>
</section>
