<section class="py-20 sm:py-28">
  <app-container>
    <app-section-heading
      eyebrow="Confianza"
      title="La experiencia de Pablo, en la voz de quienes han trabajado con él"
      description="Opiniones reales sobre su trabajo como dietista-nutricionista, publicadas en su web profesional."
    ></app-section-heading>

    <div class="mt-14 grid gap-10 border-t border-ink/10 pt-10 sm:max-w-3xl sm:grid-cols-2 sm:gap-0 sm:divide-x sm:divide-ink/10">
      @for (t of testimonials; track t.author) {
        <figure class="sm:px-10 sm:first:pl-0">
          <span class="text-3xl font-extrabold text-mint">“</span>
          <blockquote class="-mt-2 text-base leading-relaxed text-ink/85">{{ t.quote }}</blockquote>
          <figcaption class="mt-4 text-sm">
            <span class="font-semibold text-forest">{{ t.author }}</span>
            <span class="text-muted"> · {{ t.role }}</span>
          </figcaption>
        </figure>
      }
    </div>

    <div class="mt-10 flex max-w-2xl items-start gap-3 border-l-2 border-mint pl-5">
      <p class="text-sm leading-relaxed text-ink/70">{{ pilotNote }}</p>
    </div>
  </app-container>
</section>
