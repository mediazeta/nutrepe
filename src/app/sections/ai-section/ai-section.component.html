<section class="bg-forest py-20 text-cream sm:py-28">
  <app-container>
    <app-section-heading
      [light]="true"
      eyebrow="Tecnología con respaldo humano"
      title="La inteligencia artificial te acompaña. Tu nutricionista te guía."
      description="La IA mejora tu experiencia del día a día, pero nunca sustituye la valoración ni las decisiones clínicas de tu dietista-nutricionista."
    ></app-section-heading>

    <div class="mt-14 grid gap-10 lg:grid-cols-2 lg:items-center">
      <div class="flex justify-center lg:justify-start">
        <div>
          <div class="mb-4 flex items-center gap-2 text-mint">
            <lucide-angular name="sparkles" class="h-4 w-4"></lucide-angular>
            <span class="text-xs font-bold uppercase tracking-[0.14em]">Captura real de la app</span>
          </div>
          <app-phone-frame tone="dark">
            <img src="app/chat.png" alt="Asistente inteligente de Nutrepe respondiendo sobre el menú del día" class="h-full w-full object-cover object-top" />
          </app-phone-frame>
        </div>
      </div>

      <div class="divide-y divide-white/10 border-y border-white/10">
        @for (g of guarantees; track g.title) {
          <div class="flex gap-4 py-6 first:pt-0 last:pb-0">
            <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-full border border-mint/30 text-mint">
              <lucide-angular [name]="g.icon" class="h-5 w-5"></lucide-angular>
            </span>
            <div>
              <h3 class="font-bold text-cream">{{ g.title }}</h3>
              <p class="mt-1 text-sm leading-relaxed text-cream/70">{{ g.text }}</p>
            </div>
          </div>
        }
      </div>
    </div>
  </app-container>
</section>
